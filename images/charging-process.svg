<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430"><rect width="1400" height="430" fill="white"/><text x="700" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Wireless EV Charging Prototype — Energy Flow</text><g font-family="Arial" text-anchor="middle"><g fill="#f5f5f5" stroke="#222" stroke-width="2"><rect x="40" y="130" width="160" height="100" rx="14"/><rect x="250" y="130" width="160" height="100" rx="14"/><rect x="460" y="130" width="160" height="100" rx="14"/><rect x="670" y="130" width="160" height="100" rx="14"/><rect x="880" y="130" width="160" height="100" rx="14"/><rect x="1090" y="130" width="220" height="100" rx="14"/></g><g font-size="18" fill="#222"><text x="120" y="170">DC Supply</text><text x="120" y="200">12 V prototype</text><text x="330" y="170">Oscillator</text><text x="330" y="200">MOSFET Driver</text><text x="540" y="170">TX Coil</text><text x="540" y="200">Resonant Network</text><text x="750" y="170">RX Coil</text><text x="750" y="200">Magnetic Coupling</text><text x="960" y="170">Rectifier</text><text x="960" y="200">+ Filter</text><text x="1200" y="170">CC/CV Regulation</text><text x="1200" y="200">Battery / Load</text></g><g stroke="#222" stroke-width="3"><path d="M200 180 H250"/><path d="M410 180 H460"/><path d="M620 180 H670"/><path d="M830 180 H880"/><path d="M1040 180 H1090"/></g><g font-family="Arial" fill="#333"><text x="700" y="310" text-anchor="middle" font-size="20">Measure Vout, Iout, input power, output power, efficiency, alignment and temperature</text><text x="700" y="350" text-anchor="middle" font-size="17">Prototype focus: understand the complete energy-transfer chain rather than claim production EV charging performance.</text></g></g></svg>