<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="white"/><text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Prototype Testing &amp; Measurement Workflow</text><g font-family="Arial" text-anchor="middle" fill="#f5f5f5" stroke="#222" stroke-width="2"><rect x="60" y="120" width="220" height="90" rx="14"/><rect x="350" y="120" width="220" height="90" rx="14"/><rect x="640" y="120" width="220" height="90" rx="14"/><rect x="930" y="120" width="220" height="90" rx="14"/><rect x="350" y="350" width="220" height="90" rx="14"/><rect x="640" y="350" width="220" height="90" rx="14"/></g><g font-family="Arial" fill="#222"><text x="170" y="158" font-size="19">1. Align Coils</text><text x="170" y="187" font-size="16">Set TX/RX gap</text><text x="460" y="158" font-size="19">2. Power Transfer</text><text x="460" y="187" font-size="16">Observe receiver output</text><text x="750" y="158" font-size="19">3. Measure</text><text x="750" y="187" font-size="16">Vin, Iin, Vout, Iout</text><text x="1040" y="158" font-size="19">4. Calculate</text><text x="1040" y="187" font-size="16">Power + efficiency</text><text x="460" y="388" font-size="19">5. Repeat</text><text x="460" y="417" font-size="16">Distance / alignment / load</text><text x="750" y="388" font-size="19">6. Evaluate</text><text x="750" y="417" font-size="16">Heating + limitations</text></g><g stroke="#222" stroke-width="3" fill="none"><path d="M280 165 H350"/><path d="M570 165 H640"/><path d="M860 165 H930"/><path d="M1040 210 V295 H460 V350"/><path d="M570 395 H640"/></g><text x="600" y="510" text-anchor="middle" font-family="Arial" font-size="17">Actual numerical results should come from the physical prototype or simulator.</text></svg>